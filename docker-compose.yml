services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
    command:
      - uvicorn
      - elevator_pdm.presentation.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      ELEVATOR_DATABASE__URL: sqlite:////app/data/elevator.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    restart: unless-stopped

  alert-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
    command:
      - python
      - scripts/process_alert_pipeline.py
    environment:
      ELEVATOR_DATABASE__URL: sqlite:////app/data/elevator.db
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped
