services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
    command:
      - uvicorn
      - elevator_pdm.presentation.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      ELEVATOR_DATABASE__URL: sqlite:////app/data/elevator.db
      ELEVATOR_MQTT__BROKER_URL: ${ELEVATOR_MQTT__BROKER_URL}
      ELEVATOR_MQTT__PORT: ${ELEVATOR_MQTT__PORT:-1883}
      ELEVATOR_MQTT__USERNAME: ${ELEVATOR_MQTT__USERNAME}
      ELEVATOR_MQTT__PASSWORD: ${ELEVATOR_MQTT__PASSWORD}
      ELEVATOR_MQTT__TOPIC_R: ${ELEVATOR_MQTT__TOPIC_R:-embody/r}
      ELEVATOR_MQTT__TOPIC_W: ${ELEVATOR_MQTT__TOPIC_W:-embody/w}
      ELEVATOR_MQTT__CLIENT_ID: ${ELEVATOR_MQTT__CLIENT_ID:-embody002}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health").read()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  alert-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
    command:
      - python
      - scripts/process_alert_pipeline.py
    environment:
      ELEVATOR_DATABASE__URL: sqlite:////app/data/elevator.db
      ELEVATOR_MQTT__BROKER_URL: ${ELEVATOR_MQTT__BROKER_URL}
      ELEVATOR_MQTT__PORT: ${ELEVATOR_MQTT__PORT:-1883}
      ELEVATOR_MQTT__USERNAME: ${ELEVATOR_MQTT__USERNAME}
      ELEVATOR_MQTT__PASSWORD: ${ELEVATOR_MQTT__PASSWORD}
      ELEVATOR_MQTT__TOPIC_R: ${ELEVATOR_MQTT__TOPIC_R:-embody/r}
      ELEVATOR_MQTT__TOPIC_W: ${ELEVATOR_MQTT__TOPIC_W:-embody/w}
      ELEVATOR_MQTT__CLIENT_ID: ${ELEVATOR_MQTT__CLIENT_ID:-embody002}
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  sensor-poller:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
    command:
      - python
      - scripts/poll_sensor_pipeline.py
    environment:
      ELEVATOR_DATABASE__URL: sqlite:////app/data/elevator.db
      ELEVATOR_SENSORS__SOURCE: ${ELEVATOR_SENSORS__SOURCE:-mock}
      ELEVATOR_SERIAL__PORT: ${ELEVATOR_SERIAL__PORT:-/dev/ttyUSB0}
      ELEVATOR_SERIAL__BAUDRATE: ${ELEVATOR_SERIAL__BAUDRATE:-19200}
      ELEVATOR_SERIAL__BYTESIZE: ${ELEVATOR_SERIAL__BYTESIZE:-8}
      ELEVATOR_SERIAL__PARITY: ${ELEVATOR_SERIAL__PARITY:-E}
      ELEVATOR_SERIAL__STOPBITS: ${ELEVATOR_SERIAL__STOPBITS:-1}
      ELEVATOR_CONTROLLER__SLAVE_ID: ${ELEVATOR_CONTROLLER__SLAVE_ID:-1}
      ELEVATOR_CONTROLLER__REGISTER_1047: ${ELEVATOR_CONTROLLER__REGISTER_1047:-1047}
      ELEVATOR_CONTROLLER__REGISTER_0X2121: ${ELEVATOR_CONTROLLER__REGISTER_0X2121:-8481}
      ELEVATOR_CONTROLLER__REGISTER_0X2122: ${ELEVATOR_CONTROLLER__REGISTER_0X2122:-8482}
      ELEVATOR_MQTT__BROKER_URL: ${ELEVATOR_MQTT__BROKER_URL}
      ELEVATOR_MQTT__PORT: ${ELEVATOR_MQTT__PORT:-1883}
      ELEVATOR_MQTT__USERNAME: ${ELEVATOR_MQTT__USERNAME}
      ELEVATOR_MQTT__PASSWORD: ${ELEVATOR_MQTT__PASSWORD}
      ELEVATOR_MQTT__TOPIC_R: ${ELEVATOR_MQTT__TOPIC_R:-embody/r}
      ELEVATOR_MQTT__TOPIC_W: ${ELEVATOR_MQTT__TOPIC_W:-embody/w}
      ELEVATOR_MQTT__CLIENT_ID: ${ELEVATOR_MQTT__CLIENT_ID:-embody002}
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    devices:
      - ${ELEVATOR_SERIAL__PORT:-/dev/ttyUSB0}:${ELEVATOR_SERIAL__PORT:-/dev/ttyUSB0}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
