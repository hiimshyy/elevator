serial:
  port: /dev/ttyUSB0
  baudrate: 19200
  bytesize: 8
  parity: E
  stopbits: 1
  timeout_s: 1.0

sensors:
  source: mock
  vibration:
    slave_id: 1
    poll_interval_s: 5
    model: ES-VS-01
  temp_humid:
    slave_id: 2
    poll_interval_s: 30
    model: ES35-SW
  load:
    slave_id: 3
    poll_interval_s: 1
    model: RW-ST01D

controller:
  slave_id: 1
  register_1047: 1047
  register_0x2121: 8481
  register_0x2122: 8482
  sensor_id: CTRL-485-01

elevator:
  id: elev-001
  max_capacity_kg: 1000

thresholds:
  accel_rms_warning_mg: 80
  accel_rms_critical_mg: 150
  load_overload_pct: 0.95
  motor_temp_warning_c: 65
  motor_temp_critical_c: 80

models:
  vibration_anomaly: models/vibration_anomaly_v1.onnx
  health_score: models/health_score_v1.onnx

alerts:
  rate_limit_minutes: 15
  slack_webhook: ${SLACK_WEBHOOK}
  smtp_host: ${SMTP_HOST}
  smtp_port: 587
  smtp_from: alerts@your-company.com
  smtp_to:
    - tech@your-company.com

mqtt:
  broker_url: ""
  port: 1883
  username: ""
  password: ""
  topic_r: "embody/r"
  topic_w: "embody/w"
  client_id: "embody002"
  qos: 1
